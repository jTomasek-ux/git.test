<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <section class="card">
        <h1 class="title">Rock Paper Scissors</h1>
        <p class="subtitle">First to 5 points wins.</p>

        <div class="scoreboard">
          <div class="score">
            <span class="label">You</span>
            <span id="player-score" class="value">0</span>
          </div>
          <div class="score">
            <span class="label">Computer</span>
            <span id="computer-score" class="value">0</span>
          </div>
        </div>

        <div class="choices">
          <button class="choice" data-choice="rock">Rock</button>
          <button class="choice" data-choice="paper">Paper</button>
          <button class="choice" data-choice="scissors">Scissors</button>
        </div>

        <div class="results">
          <p id="round-result" class="round-result">Make your move!</p>
          <p id="last-round" class="last-round"></p>
        </div>

        <button id="reset" class="reset" type="button">Reset Game</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
  </html>
